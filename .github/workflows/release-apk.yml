name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title (e.g. Pixel Funds v1.0.0)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_NAME: ${{ inputs.release_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          TITLE="${INPUT_NAME:-Pixel Funds $TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore optional google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_PW" ]; then
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Release APK
        if: steps.signing.outputs.has_release_signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          gradle testDebugUnitTest assembleRelease --stacktrace
          mkdir -p release-assets
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_OUT="release-assets/Pixel-Funds-${{ steps.meta.outputs.tag }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          (cd release-assets && sha256sum "$(basename "$APK_OUT")" > "$(basename "$APK_OUT").sha256")
          echo "apk_filename=$(basename "$APK_OUT")" >> "$GITHUB_ENV"
          echo "signing_note=Signed with the repository release keystore." >> "$GITHUB_ENV"

      - name: Build installable Debug APK (fallback when release keystore secrets are not set)
        if: steps.signing.outputs.has_release_signing != 'true'
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          gradle testDebugUnitTest assembleDebug --stacktrace
          mkdir -p release-assets
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APK_OUT="release-assets/Pixel-Funds-${{ steps.meta.outputs.tag }}-debug.apk"
          cp "$APK_SRC" "$APK_OUT"
          (cd release-assets && sha256sum "$(basename "$APK_OUT")" > "$(basename "$APK_OUT").sha256")
          echo "apk_filename=$(basename "$APK_OUT")" >> "$GITHUB_ENV"
          echo "signing_note=Debug-signed build (configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets for production release signing)." >> "$GITHUB_ENV"

      - name: Compose release notes
        run: |
          SHA=$(cut -d' ' -f1 "release-assets/${{ env.apk_filename }}.sha256")
          cat <<EOF > release-notes.md
          ## Pixel Funds ${{ steps.meta.outputs.tag }}

          ### Download & Install (Android 7.0+ / API 24+)
          1. Download **\`${{ env.apk_filename }}\`** from the **Assets** section below.
          2. Open the downloaded file on your Pixel / Android device and allow installation from your browser or Files app if prompted.
          3. Launch **Pixel Funds** — works immediately in on-device local mode!

          ### Verification
          - **Artifact:** \`${{ env.apk_filename }}\`
          - **SHA-256:** \`${SHA}\`
          - **Signing:** ${{ env.signing_note }}
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.sha256
